services:
  monitor:
    build: .
    image: sdut-dorm-monitor:latest
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      TZ: Asia/Shanghai
      SSWS_DATA_DIR: /app/data
      WEBUI_ALLOWED_HOSTS: 127.0.0.1,localhost,::1
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=5)); assert r['worker_alive']"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
